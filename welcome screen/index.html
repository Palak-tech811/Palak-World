<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PALAK.EXE | Portfolio Adventure</title>

    <link rel="stylesheet" href="style.css">

    <!-- Pixel font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

    <main class="game-screen">

        <div class="game-world">

            <!-- Background environment -->
            <div class="sky"></div>
            <div class="path"></div>

            <!-- Swimming pool -->
            <div class="pool">
                <div class="water"></div>
            </div>

            <!-- Decorations -->
            <div class="tree tree-one">🌳</div>
            <div class="tree tree-two">🌳</div>

            <div class="bench bench-one">🪑</div>
            <div class="bench bench-two">🪑</div>

            <div class="flower flower-one">🌼</div>
            <div class="flower flower-two">🌸</div>

            <!-- Main menu -->
            <section class="welcome-content">

                <p class="game-label">✦ AN INTERACTIVE PORTFOLIO ✦</p>

                <h1>PALAK</h1>

                <h2>THE PORTFOLIO ADVENTURE</h2>

                <p class="description">
                    Developer • Designer • Dreamer
                </p>

                <button id="startButton" class="start-button">
                    START GAME
                </button>

                <p class="press-start">▼ PRESS START TO EXPLORE ▼</p>

            </section>

            <!-- Player character placeholder -->
            <div class="player" aria-label="Pixel character">
                <div class="player-head"></div>
                <div class="player-body"></div>
                <div class="player-legs"></div>
            </div>

            <!-- Bottom information -->
            <div class="bottom-info">
                <span>© 2026 PALAK</span>
                <span>PLAYER 01</span>
                <span>LEVEL 01</span>
            </div>

        </div>
<!-- CHARACTER CREATOR SCREEN -->

<section id="characterScreen" class="character-screen hidden">

    <div class="creator-container">

        <h1>CHARACTER SELECT</h1>

        <p class="creator-subtitle">
            Choose your adventurer!
        </p>

        <!-- CHARACTER PRESETS -->

        <div class="preset-section">

            <h2>CHOOSE YOUR CHARACTER</h2>

            <div class="preset-list">

                <button class="preset-card active"
                    data-preset="explorer">
                    🧑🏻‍🌾
                    <span>EXPLORER</span>
                </button>

                <button class="preset-card"
                    data-preset="coder">
                    👩🏻‍💻
                    <span>CODER</span>
                </button>

                <button class="preset-card"
                    data-preset="artist">
                    👩🏽‍🎨
                    <span>ARTIST</span>
                </button>

                <button class="preset-card"
                    data-preset="hero">
                    🧙🏻‍♀️
                    <span>HERO</span>
                </button>

            </div>
        </div>

        <!-- CHARACTER PREVIEW -->

        <div class="character-preview">

            <h2>YOUR AVATAR</h2>

            <div id="avatar" class="avatar">
                🧑🏻‍🌾
            </div>

            <p id="characterName">THE EXPLORER</p>

        </div>

        <!-- CUSTOMIZATION OPTIONS -->

        <div class="customization">

            <h2>CUSTOMIZE YOUR CHARACTER</h2>

            <label for="skinTone">Skin Tone</label>

            <select id="skinTone">
                <option value="light">Light</option>
                <option value="medium">Medium</option>
                <option value="dark">Dark</option>
            </select>

            <label for="hairStyle">Hairstyle</label>

            <select id="hairStyle">
                <option value="short">Short</option>
                <option value="long">Long</option>
                <option value="curly">Curly</option>
            </select>

            <label for="outfit">Outfit</label>

            <select id="outfit">
                <option value="casual">Casual</option>
                <option value="hoodie">Hoodie</option>
                <option value="adventure">Adventure</option>
            </select>

            <label for="accessory">Accessories</label>

            <select id="accessory">
                <option value="none">None</option>
                <option value="glasses">Glasses</option>
                <option value="cap">Cap</option>
                <option value="headphones">Headphones</option>
            </select>

            <label for="playerName">Player Name</label>

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                maxlength="15"
            >

        </div>

        <button id="confirmCharacter">
            CONFIRM CHARACTER →
        </button>

    </div>

</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
